name: ai-quality-loop
description: >-
  B(AI·검색) 품질 개선 루프. 계획 -> (구현·검증·측정)을 목표 달성까지 최대 3회 반복 ->
  보안·출처 근거 검토를 병렬로 실행 -> 결과 통합.
inputs:
  goal: prompt
steps:
  - type: step
    id: plan
    agent: wf-planner
    prompt: >-
      목표: {{goal}}

      .kiro/specs/ai-search-quality/requirements.md, design.md, tasks.md와
      .kiro/steering/ai-module.md를 읽고, src/ai/와 test/ai/ 안에서만 바꾸는 계획을 세운다.
      각 변경마다 검증할 요구사항 번호, 추가할 테스트, 측정 방법(kiro-cli 로그인 후
      node scripts/measure-kiro.js --runs 1)을 적는다. 파일은 고치지 않는다.
      계획을 .kiro/workflow-output/ai-quality-plan.md에 쓰고, 성공 기준을 한 줄로 끝에 적는다.
    artifacts:
      plan: .kiro/workflow-output/ai-quality-plan.md

  - type: repeat
    id: improve-loop
    maxIterations: 3
    onMaxIterations: pause
    stopCondition:
      fileCheck:
        path: .kiro/workflow-output/ai-quality-status.json
        jsonPath: $.complete
        value: true
    steps:
      - type: step
        id: implement-and-measure
        agent: wf-coder
        prompt: >-
          {{artifacts.plan}}의 계획에서 아직 끝나지 않은 항목 하나를 구현한다.
          테스트를 먼저 추가하고, node --test "test/**/*.test.js"와 node scripts/check.js를 통과시킨다.
          프롬프트나 스키마를 바꿨으면 node --test "test/ai/*.test.js"로 확인한다. 실제 Kiro 측정은 크레딧이 들어 사용자에게 남긴다.
          src/core/service.js 이벤트 형식은 바꾸지 않는다. 생성된 문장 원문은 기록하지 않는다.
          작업 단위로 feat(ai) 커밋을 만들고 push하지 않는다.
          .kiro/workflow-output/ai-quality-status.json에 {"complete": <계획의 모든 항목과 성공 기준을 충족했으면 true>,
          "done": [...], "remaining": [...], "tests": "통과 수/전체"}를 쓴다.

  - type: parallel
    id: reviews
    joinPolicy: allSettled
    branches:
      - type: step
        id: security-review
        agent: semantic_reviewer
        prompt: >-
          main...HEAD 변경을 docs/SECURITY_REVIEW.md 위협 표 기준으로 검토한다.
          특히 프롬프트 데이터 이스케이프(escapeData), 선택 텍스트의 로그·파일 유출,
          kiro-cli 실행 옵션(--trust-tools 미사용, cwd 격리), 비밀값 하드코딩을 확인한다.
      - type: step
        id: grounding-review
        agent: semantic_reviewer
        prompt: >-
          main...HEAD 변경이 "사실은 검색 출처에 연결된 것만 표시하고, 부족하면 지어내지 않는다"는 원칙을
          지키는지 검토한다. src/ai/schema.js의 sourceRefs, SUPPORT_MIN, shortfalls 처리와
          test/ai/schema.test.js의 경계 사례가 충분한지 본다.

  - type: step
    id: summarize
    agent: wf-review-aggregator
    prompt: >-
      아래 두 검토와 {{artifacts.plan}}, .kiro/workflow-output/ai-quality-status.json을 합쳐
      바꾼 것, 검증 결과, 남은 위험, 사용자가 결정할 일을 한 문서로 정리한다.

      보안 검토: {{security-review.output}}

      출처 근거 검토: {{grounding-review.output}}
